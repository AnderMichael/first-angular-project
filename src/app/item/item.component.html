<div
  [ngClass]="person ? (person.type == 'student' ? 'container' : 'container-prof') : 'container-prof'"
>
  <div *ngIf="person">
    <h1>{{ person.name }} {{ person.lastName }} - {{ person.type }}</h1>
    <button (click)="onSendPerson()">Show</button>
    <button (click)="onDeletePerson()">Delete</button>
  </div>
  <ng-content></ng-content>
</div>
